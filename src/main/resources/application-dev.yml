spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/milktea}
    username: ${DB_USERNAME:milktea}
    password: ${DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: debug
server:
  port: ${SERVER_PORT:8088}

