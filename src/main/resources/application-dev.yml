spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/milktea}
    username: ${DB_USERNAME:milktea}
    password: ${DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: debug
