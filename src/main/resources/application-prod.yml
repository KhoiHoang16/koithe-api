spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:milktea}
    username: ${DB_USERNAME:milktea}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  jpa:
    properties:
      hibernate:
        format_sql: false
logging:
  level:
    root: INFO
