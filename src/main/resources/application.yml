spring:
  application:
    name: milktea-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-minimum-32-character-secret}
    access-token-minutes: 15
    refresh-token-days: 7
