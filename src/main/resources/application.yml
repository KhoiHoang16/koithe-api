spring:
  application:
    name: milktea-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-minimum-32-character-secret}
    access-token-minutes: 15
    refresh-token-days: 7
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:2QXUI4B4}
    hash-secret: ${VNPAY_HASH_SECRET:RAOCTAV2VYRW19J77TIFOUF9NE0U0DBC}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8088/api/payments/vnpay-return}
  momo:
    partner-code: ${MOMO_PARTNER_CODE:MOMOBKUN20180529}
    access-key: ${MOMO_ACCESS_KEY:klm05TvNBzhg7h7j}
    secret-key: ${MOMO_SECRET_KEY:at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}
    pay-url: ${MOMO_PAY_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    return-url: ${MOMO_RETURN_URL:http://localhost:8088/api/payments/momo-return}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8088/api/payments/momo-ipn}
  vietqr:
    bank-id: ${VIETQR_BANK_ID:MB}
    account-no: ${VIETQR_ACCOUNT_NO:0987654321}
    account-name: ${VIETQR_ACCOUNT_NAME:KOI THE MILKTEA}
